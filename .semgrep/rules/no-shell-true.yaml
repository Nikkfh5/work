rules:
  - id: no-shell-true
    languages: [python]
    severity: CRITICAL
    message: >
      shell=True is forbidden (Invariant #5). All external commands must go through
      safe_exec with allowlist. Using shell=True enables command injection.
    patterns:
      - pattern-either:
          - pattern: subprocess.run(..., shell=True, ...)
          - pattern: subprocess.Popen(..., shell=True, ...)
          - pattern: subprocess.call(..., shell=True, ...)
          - pattern: subprocess.check_call(..., shell=True, ...)
          - pattern: subprocess.check_output(..., shell=True, ...)
          - pattern: os.system(...)
          - pattern: os.popen(...)
    metadata:
      category: security
      confidence: HIGH
      impact: HIGH
      invariant: "5"
      description: "Invariant #5: All external commands only through safe_exec, never shell=True"
